# Gradient Mesh Dark — rich saturated dark aurora.
# Deep plum through teal to amber — a premium keynote dark. The moody sibling
# of aurora-mesh's light pastel and glassmorphism's violet.

name: gradient-mesh-dark
label: Gradient Mesh Dark
summary: A rich dark aurora — deep plum through teal to amber. Premium keynote.

tokens:
  palette:
    bg: "#171226"          # deep plum-black
    surface: "#231A33"
    ink: "#EFE9F7"         # lavender white
    ink_muted: "#A99FC2"
    accent: "#7A5CF0"      # violet
    accent_alt: "#37C8C0"  # teal
    rule: "#3A3050"
    on_accent: "#171226"

  surfaces:
    title:   { bg: "#0F0B1C", ink: "#EFE9F7", muted: "#9C8FC0", accent: "#37C8C0" }
    section: { bg: "#7A5CF0", ink: "#FFFFFF", muted: "#D6CDFB" }

  dark:
    bg: "#0F0B1C"
    surface: "#1B1429"
    ink: "#EFE9F7"
    ink_muted: "#9C8FC0"
    accent: "#8B6DFF"
    accent_alt: "#4AD3CB"
    rule: "#312A4A"
    on_accent: "#0F0B1C"

  type:
    display:  { family: "Syne",        weight: 700, size: 38, line: 1.1,  tracking: -0.5 }
    heading:  { family: "Syne",        weight: 600, size: 28, line: 1.15, tracking: -0.3 }
    subhead:  { family: "Manrope",     weight: 400, size: 14, line: 1.5,  tracking: 0 }
    body:     { family: "Manrope",     weight: 400, size: 12.5, line: 1.6, tracking: 0 }
    caption:  { family: "Manrope",     weight: 500, size: 10, line: 1.35, tracking: 0.2 }
    eyebrow:  { family: "Manrope",     weight: 700, size: 10, line: 1.2,  tracking: 1.6, transform: upper }
    stat:     { family: "Syne",        weight: 700, size: 54, line: 1.0,  tracking: -1 }

  grid:
    margin: { top: 0.62, right: 0.7, bottom: 0.55, left: 0.7 }
    gutter: 0.30
    columns: 12
    band: { eyebrow_y: 0.62, title_y: 1.30, body_y: 2.55 }

  shape:
    radius: { card: 0.16, pill: 0.40, chip: 0.08 }
    border: { width: 1, color: "#FFFFFF1A" }
    card_pad: 0.30

  shadow:
    card: { type: outer, blur: 16, offset: 4, angle: 90, color: "0F0B1C", opacity: 0.35 }

  plate:
    enabled: true
    html: |
      <style>
        .mesh{position:absolute;inset:0;background:
          radial-gradient(70% 60% at 14% 14%, {{tokens.palette.accent}}66 0%, transparent 55%),
          radial-gradient(65% 58% at 88% 18%, {{tokens.palette.accent_alt}}55 0%, transparent 55%),
          radial-gradient(95% 85% at 50% 118%, {{tokens.palette.accent_alt}}44 0%, transparent 72%),
          linear-gradient(150deg, {{tokens.palette.bg}} 0%, {{tokens.palette.ink}} 100%);}
        .b{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5}
        .b1{left:6%;top:8%;width:32%;height:38%;background:{{tokens.palette.accent}}88}
        .b2{right:4%;top:4%;width:28%;height:32%;background:{{tokens.palette.accent_alt}}77}
        .b3{left:24%;bottom:-12%;width:52%;height:40%;background:{{tokens.palette.accent}}55}
      </style>
      <div class="mesh"></div>
      <div class="b b1"></div><div class="b b2"></div><div class="b b3"></div>
    surfaces:
      title: |
        <style>
          .hero{position:absolute;inset:0;background:
            radial-gradient(82% 72% at 16% 14%, {{tokens.palette.accent}}aa 0%, transparent 52%),
            radial-gradient(70% 60% at 86% 20%, {{tokens.palette.accent_alt}}99 0%, transparent 52%),
            radial-gradient(105% 95% at 50% 125%, {{tokens.surfaces.title.bg}} 0%, transparent 78%),
            linear-gradient(155deg, {{tokens.surfaces.title.bg}} 0%, {{tokens.palette.ink}} 100%);}
          .b{position:absolute;border-radius:50%;filter:blur(80px);opacity:.55}
          .b1{left:8%;top:10%;width:30%;height:34%;background:{{tokens.palette.accent}}99}
          .b2{right:6%;top:6%;width:26%;height:30%;background:{{tokens.palette.accent_alt}}88}
        </style>
        <div class="hero"></div>
        <div class="b b1"></div><div class="b b2"></div>
      section: |
        <style>
          .sec{position:absolute;inset:0;background:
            radial-gradient(78% 68% at 16% 18%, {{tokens.surfaces.section.bg}} 0%, transparent 56%),
            radial-gradient(70% 60% at 86% 26%, {{tokens.palette.accent_alt}}88 0%, transparent 56%),
            linear-gradient(150deg, {{tokens.surfaces.section.bg}} 0%, {{tokens.palette.accent}} 100%);}
          .s{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5}
          .s1{left:10%;bottom:6%;width:32%;height:30%;background:{{tokens.surfaces.section.muted}}55}
        </style>
        <div class="sec"></div>
        <div class="s s1"></div>

voice:
  feel: dramatic, premium, confident, immersive
  density: medium
  prefers:
    - a bold keynote statement
    - a strong open and a strong close
    - visuals over walls of text
  avoid:
    - flat, bored, neutral tone
    - dense paragraphs
    - pastel or washed-out imagery
  headline_style: >
    Bold and cinematic. "The Pipeline After Dark" over "Rendering". Make it
    feel like the headline of a keynote.
  body_style: >
    Confident full sentences. State the claim, then the evidence, briefly.
