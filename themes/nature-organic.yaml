voice:
  feel: warm, grounded, clear, unhurried
  density: medium
  prefers:
    - concrete, sensory language
    - comparisons that feel like living systems
    - a closing line that lands gently
  avoid:
    - corporate jargon
    - dense bullet walls
    - harsh or alarmist phrasing
  headline_style: >
    Grounded and specific. "What the Soil Actually Needs" over "Soil Science".
    Prefer the concrete image over the abstract label.
  body_style: >
    Full sentences, warm but precise. Lead with the observation, then the reason.
