name: claymorphism
label: Claymorphism
summary: Soft extruded clay panels with inner shadows — warm, rounded, playful.
tokens:
  palette:
    bg: "#F4EBDE"
    surface: "#EFD8C0"
    ink: "#463B30"
    ink_muted: "#8B7B68"
    accent: "#E07A5F"
    accent_alt: "#F2CC8F"
    rule: "#E7D6BE"
    on_accent: "#0A0A0A"
  surfaces:
    title:
      bg: "#463B30"
      ink: "#F7EFE3"
      muted: "#CDBB9F"
      accent: "#E07A5F"
    section:
      bg: "#E07A5F"
      ink: "#FFFFFF"
      muted: "#FBE0D4"
  dark:
    bg: "#2A2118"
    surface: "#3D3225"
    ink: "#F2E8D8"
    ink_muted: "#B3A286"
    accent: "#E07A5F"
    accent_alt: "#E8BC82"
    rule: "#FFFFFF1A"
    on_accent: "#FFFFFF"
  type:
    display:
      family: Poppins
      weight: 700
      size: 36
      line: 1.12
      tracking: -0.4
    heading:
      family: Poppins
      weight: 600
      size: 28
      line: 1.18
      tracking: -0.2
    subhead:
      family: Inter
      weight: 500
      size: 15
      line: 1.4
      tracking: 0
    body:
      family: Inter
      weight: 400
      size: 13
      line: 1.55
      tracking: 0
    caption:
      family: Inter
      weight: 500
      size: 10
      line: 1.35
      tracking: 0.2
    eyebrow:
      family: Inter
      weight: 600
      size: 10
      line: 1.2
      tracking: 1.2
      transform: upper
    stat:
      family: Poppins
      weight: 700
      size: 52
      line: 1
      tracking: -1
  grid:
    margin:
      top: 0.62
      right: 0.7
      bottom: 0.55
      left: 0.7
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0.55
      pill: 0.4
      chip: 0.14
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
    card_fill:
      color: "#EFD8C0"
      transparency: 18
  shadow:
    card:
      type: outer
      blur: 20
      offset: 7
      angle: 90
      color: 463B30
      opacity: 0.16
  plate:
    enabled: true
    html: >
      <style>
        .wash{position:absolute;inset:0;background:
          radial-gradient(75% 65% at 16% 18%, {{tokens.palette.accent_alt}}55 0%, transparent 55%),
          radial-gradient(70% 60% at 86% 80%, {{tokens.palette.accent}}44 0%, transparent 55%),
          linear-gradient(155deg, {{tokens.palette.bg}} 0%, {{tokens.palette.surface}} 100%);}
        .board{position:absolute;left:{{box.x}}px;top:{{box.y}}px;width:{{box.w}}px;height:{{box.h}}px;
          border-radius:44px;
          background:linear-gradient(160deg, {{tokens.palette.surface}}d9 0%, {{tokens.palette.bg}} 100%);
          box-shadow:
            0 22px 44px {{tokens.palette.ink}}2e,
            inset 0 10px 16px {{tokens.palette.surface}}99,
            inset 0 -12px 20px {{tokens.palette.ink}}2e;}
      </style>

      <div class="wash"></div>

      <div class="board"></div>
    surfaces:
      title: >
        <style>
          .hero{position:absolute;inset:0;background:
            radial-gradient(70% 60% at 20% 18%, {{tokens.palette.accent}}99 0%, transparent 52%),
            radial-gradient(65% 55% at 84% 26%, {{tokens.palette.accent_alt}}88 0%, transparent 52%),
            linear-gradient(155deg, {{tokens.surfaces.title.bg}} 0%, {{tokens.palette.ink}} 100%);}
          .lump{position:absolute;right:8%;bottom:8%;width:30%;height:26%;border-radius:50%;
            background:{{tokens.palette.surface}}22;filter:blur(40px);}
        </style>

        <div class="hero"></div>

        <div class="lump"></div>
      section: >
        <style>
          .sec{position:absolute;inset:0;background:
            radial-gradient(70% 60% at 18% 22%, {{tokens.surfaces.section.bg}} 0%, transparent 55%),
            radial-gradient(65% 55% at 84% 78%, {{tokens.palette.accent_alt}}88 0%, transparent 55%),
            linear-gradient(150deg, {{tokens.surfaces.section.bg}} 0%, {{tokens.palette.accent}} 100%);}
        </style>

        <div class="sec"></div>
voice:
  feel: warm, playful, tactile, handmade
  density: medium
  prefers:
    - friendly, approachable language
    - rounded card breakdowns
    - a single strong takeaway
  avoid:
    - cold corporate phrasing
    - dense tables that fight the soft shapes
    - sharp contrast edges
  headline_style: >
    Friendly and concrete. "Clay, One Mould at a Time" over "Introduction to
    Claymorphism". Keep the warmth, lose the filler.
  body_style: |
    Full sentences, plain words. Explain like you are showing a colleague.
