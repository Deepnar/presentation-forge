name: aurora-mesh
label: Aurora Mesh
summary: Flowing multi-stop mesh gradients — violet, pink and indigo light.
tokens:
  palette:
    bg: "#F6F3FF"
    surface: "#FFFFFF"
    ink: "#2B2255"
    ink_muted: "#6E6596"
    accent: "#6B3CE8"
    accent_alt: "#E84393"
    rule: "#E5E0F7"
    on_accent: "#FFFFFF"
  surfaces:
    title:
      bg: "#2B2255"
      ink: "#FFFFFF"
      muted: "#BFB4E8"
      accent: "#E84393"
    section:
      bg: "#6B3CE8"
      ink: "#FFFFFF"
      muted: "#E3DBFF"
  dark:
    bg: "#191530"
    surface: "#241E48"
    ink: "#ECE7FF"
    ink_muted: "#A79DC9"
    accent: "#8F74F7"
    accent_alt: "#F0659F"
    rule: "#FFFFFF1A"
    on_accent: "#FFFFFF"
  type:
    display:
      family: Outfit
      weight: 700
      size: 40
      line: 1.1
      tracking: -0.6
    heading:
      family: Outfit
      weight: 600
      size: 30
      line: 1.15
      tracking: -0.4
    subhead:
      family: Inter
      weight: 500
      size: 15
      line: 1.4
      tracking: 0
    body:
      family: Inter
      weight: 400
      size: 13
      line: 1.55
      tracking: 0
    caption:
      family: Inter
      weight: 500
      size: 10
      line: 1.35
      tracking: 0.2
    eyebrow:
      family: Inter
      weight: 600
      size: 10
      line: 1.2
      tracking: 1.2
      transform: upper
    stat:
      family: Outfit
      weight: 700
      size: 54
      line: 1
      tracking: -1
  grid:
    margin:
      top: 0.62
      right: 0.7
      bottom: 0.55
      left: 0.7
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0.22
      pill: 0.4
      chip: 0.12
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
    card_fill:
      color: "#FFFFFF"
      transparency: 0
  shadow:
    card:
      type: outer
      blur: 18
      offset: 5
      angle: 90
      color: 2B2255
      opacity: 0.08
  plate:
    enabled: true
    html: >
      <style>
        .mesh{position:absolute;inset:0;background:
          radial-gradient(55% 45% at 12% 14%, {{tokens.palette.accent}} 0%, transparent 52%),
          radial-gradient(50% 42% at 88% 20%, {{tokens.palette.accent_alt}} 0%, transparent 52%),
          radial-gradient(70% 60% at 25% 95%, {{tokens.palette.ink}}40 0%, transparent 60%),
          radial-gradient(60% 55% at 78% 88%, {{tokens.palette.surface}} 0%, transparent 60%),
          radial-gradient(90% 80% at 50% 45%, {{tokens.palette.bg}} 0%, transparent 70%),
          linear-gradient(135deg, {{tokens.palette.bg}} 0%, {{tokens.palette.rule}} 100%);}
        .halo{position:absolute;left:{{box.x}}px;top:{{box.y}}px;width:{{box.w}}px;height:{{box.h}}px;
          background:radial-gradient(60% 65% at 50% 32%, {{tokens.palette.surface}}8c 0%, {{tokens.palette.surface}}00 78%);}
      </style>

      <div class="mesh"></div>

      <div class="halo"></div>
    surfaces:
      title: >
        <style>
          .hero{position:absolute;inset:0;background:
            radial-gradient(65% 55% at 16% 18%, {{tokens.palette.accent}} 0%, transparent 52%),
            radial-gradient(55% 48% at 86% 26%, {{tokens.palette.accent_alt}} 0%, transparent 52%),
            radial-gradient(75% 70% at 30% 100%, {{tokens.surfaces.title.accent}} 0%, transparent 60%),
            linear-gradient(150deg, {{tokens.surfaces.title.bg}} 0%, {{tokens.palette.ink}} 100%);}
        </style>

        <div class="hero"></div>
      section: >
        <style>
          .sec{position:absolute;inset:0;background:
            radial-gradient(70% 60% at 18% 22%, {{tokens.surfaces.section.bg}} 0%, transparent 55%),
            radial-gradient(60% 50% at 82% 30%, {{tokens.palette.accent_alt}} 0%, transparent 55%),
            linear-gradient(140deg, {{tokens.surfaces.section.bg}} 0%, {{tokens.palette.accent}} 100%);}
        </style>

        <div class="sec"></div>
voice:
  feel: luminous, fluid, futuristic but warm
  density: medium
  prefers:
    - a hero moment early
    - optimistic, forward-looking language
    - clean section dividers that lean on the gradient
  avoid:
    - heavy dense tables
    - muddy dark-on-dark text
    - more than three or four accent colours in one slide
  headline_style: >
    Bold and confident. "Light Is the Renderer" over "What Is Ray Tracing?". Let
    the gradient be loud; keep the words calm.
  body_style: |
    Full sentences. Short paragraphs. Let the mesh breathe — do not crowd it.
