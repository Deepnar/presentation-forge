name: aurora-mesh
label: Aurora Mesh
summary: Flowing multi-stop mesh gradients — violet, pink and indigo light.
tokens:
  palette:
    bg: "#F6F3FF"
    surface: "#FFFFFF"
    ink: "#2B2255"
    ink_muted: "#6E6596"
    accent: "#6B3CE8"
    accent_alt: "#E84393"
    rule: "#E5E0F7"
    on_accent: "#FFFFFF"
  surfaces:
    title:
      bg: "#2B2255"
      ink: "#FFFFFF"
      muted: "#BFB4E8"
      accent: "#E84393"
    section:
      bg: "#6B3CE8"
      ink: "#FFFFFF"
      muted: "#E3DBFF"
  dark:
    bg: "#191530"
    surface: "#241E48"
    ink: "#ECE7FF"
    ink_muted: "#A79DC9"
    accent: "#8F74F7"
    accent_alt: "#F0659F"
    rule: "#FFFFFF1A"
    on_accent: "#FFFFFF"
  type:
    display:
      family: Outfit
      weight: 700
      size: 40
      line: 1.1
      tracking: -0.6
    heading:
      family: Outfit
      weight: 600
      size: 30
      line: 1.15
      tracking: -0.4
    subhead:
      family: Inter
      weight: 500
      size: 15
      line: 1.4
      tracking: 0
    body:
      family: Inter
      weight: 400
      size: 13
      line: 1.55
      tracking: 0
    caption:
      family: Inter
      weight: 500
      size: 10
      line: 1.35
      tracking: 0.2
    eyebrow:
      family: Inter
      weight: 600
      size: 10
      line: 1.2
      tracking: 1.2
      transform: upper
    stat:
      family: Outfit
      weight: 700
      size: 54
      line: 1
      tracking: -1
  grid:
    # A little wider than a flat theme: the content box is the inside of the
    # plate's panel, which the renderer draws past it on every side, and the
    # ground behind has to stay visible. Only a little — `flow`'s vertical
    # spine stops fitting its body above the readable floor past about 0.76in,
    # so this is the widest step that costs no theme a slide.
    margin:
      top: 0.66
      right: 0.74
      bottom: 0.58
      left: 0.74
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0.22
      pill: 0.4
      chip: 0.12
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
    card_fill:
      color: "#FFFFFF"
      transparency: 0
  shadow:
    card:
      type: outer
      blur: 18
      offset: 5
      angle: 90
      color: 2B2255
      opacity: 0.08
  plate:
    enabled: true
    # The mesh is the theme and it stays. What was missing is somewhere for the
    # words to live.
    #
    # The content surface used to be a radial white wash sitting on top of six
    # stacked gradients, which left body text on a blotchy, uneven ground — the
    # reason it read as glow rather than design. The mesh now frames the slide
    # and the content sits on an opaque panel, so the aurora is a border you
    # notice and never something you read through.
    #
    # Opaque, deliberately: glassmorphism is the theme where you see through the
    # panel. Here the mesh belongs to the edges and the page belongs to the
    # reader, which is what makes the two look like different designs rather
    # than two settings of one.
    html: >
      <style>
        .mesh{position:absolute;inset:0;background:
          radial-gradient(58% 52% at 6% 4%, {{tokens.palette.accent}} 0%, transparent 58%),
          radial-gradient(52% 46% at 96% 12%, {{tokens.palette.accent_alt}} 0%, transparent 58%),
          radial-gradient(62% 55% at 88% 100%, {{tokens.palette.accent}}b3 0%, transparent 62%),
          linear-gradient(135deg, {{tokens.palette.bg}} 0%, {{tokens.palette.rule}} 100%);}
        .page{position:absolute;left:{{panel.x}}px;top:{{panel.y}}px;width:{{panel.w}}px;height:{{panel.h}}px;
          border-radius:22px;background:{{tokens.palette.surface}};
          box-shadow:0 24px 60px {{tokens.palette.ink}}2b;}
      </style>

      <div class="mesh"></div>

      <div class="page"></div>
    surfaces:
      title: >
        <style>
          .hero{position:absolute;inset:0;background:
            radial-gradient(62% 54% at 8% 8%, {{tokens.palette.accent}} 0%, transparent 56%),
            radial-gradient(54% 48% at 94% 16%, {{tokens.palette.accent_alt}} 0%, transparent 56%),
            radial-gradient(70% 62% at 72% 104%, {{tokens.surfaces.title.accent}}cc 0%, transparent 60%),
            linear-gradient(150deg, {{tokens.surfaces.title.bg}} 0%, {{tokens.palette.ink}} 100%);}
          /* A single hairline rule under the title band, so the hero has one
             hard edge to sit against and does not read as pure vapour. */
          .rule{position:absolute;left:0;top:70%;width:46%;height:2px;
            background:{{tokens.palette.surface}}80;}
        </style>

        <div class="hero"></div>

        <div class="rule"></div>
      section: >
        <style>
          .sec{position:absolute;inset:0;background:
            radial-gradient(62% 54% at 10% 10%, {{tokens.palette.accent_alt}}d9 0%, transparent 58%),
            radial-gradient(66% 58% at 92% 96%, {{tokens.palette.accent}} 0%, transparent 62%),
            linear-gradient(140deg, {{tokens.surfaces.section.bg}} 0%, {{tokens.palette.ink}} 120%);}
          /* The section title rests on a solid slab, curved on the open end —
             the same device the content page uses, at divider scale. */
          .slab{position:absolute;left:0;top:26%;width:68%;height:44%;
            border-radius:0 999px 999px 0;
            background:{{tokens.palette.ink}}59;
            border:1px solid {{tokens.palette.surface}}2e;border-left:none;}
        </style>

        <div class="sec"></div>

        <div class="slab"></div>

voice:
  feel: luminous, fluid, futuristic but warm
  density: medium
  prefers:
    - a hero moment early
    - optimistic, forward-looking language
    - clean section dividers that lean on the gradient
  avoid:
    - heavy dense tables
    - muddy dark-on-dark text
    - more than three or four accent colours in one slide
  headline_style: >
    Bold and confident. "Light Is the Renderer" over "What Is Ray Tracing?". Let
    the gradient be loud; keep the words calm.
  body_style: |
    Full sentences. Short paragraphs. Let the mesh breathe — do not crowd it.
