      ink: "#1A1A1A"
      muted: "#6E6316"
  dark:
    bg: "#1A1A1A"
    surface: "#262626"
    ink: "#F2F0EA"
    ink_muted: "#A9A39A"
    accent: "#E53935"
    accent_alt: "#FDD835"
    rule: "#FFFFFF26"
    on_accent: "#1A1A1A"
  type:
    display:
      family: Poppins
      weight: 700
      size: 40
      line: 1.1
      tracking: -0.5
    heading:
      family: Poppins
      weight: 700
      size: 30
      line: 1.15
      tracking: -0.3
