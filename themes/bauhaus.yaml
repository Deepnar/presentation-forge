      weight: 700
      size: 10
      line: 1.2
      tracking: 1.8
      transform: upper
    stat:
      family: Poppins
      weight: 700
      size: 54
      line: 1
      tracking: -1
  grid:
    margin:
      top: 0.62
      right: 0.7
      bottom: 0.55
      left: 0.7
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0
      pill: 0.4
      chip: 0
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
  shadow:
    card:
      type: outer
      blur: 0
      offset: 0
      angle: 90
      color: 1A1A1A
      opacity: 0
  bauhaus:
    block: true
  plate:
    enabled: false
voice:
  feel: geometric, functional, modernist, confident
  density: medium
  prefers:
    - bold structural claims
    - strong visual hierarchy
    - colour used to signal, never to decorate
  avoid:
    - decoration and drop shadows
    - more than the primary triad on one slide
    - fiddly detail — the idea first, the words second
  headline_style: >
    Functional and absolute. "Form Follows Rendering" over "Introduction to Ray
    Tracing". No hedging.
  body_style: |
    Plain, efficient sentences. Build the idea; strip the rest.
