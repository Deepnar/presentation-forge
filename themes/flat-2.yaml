# Flat 2 — clean flat design, one bold indigo, no shadows.
# Crisp white, soft gray panels, an indigo primary and zero decoration. The
# whole design is the negative space around a strong accent.

name: flat-2
label: Flat 2
summary: Clean flat design — bold indigo on white, no shadows, crisp.

tokens:
  palette:
    bg: "#FFFFFF"
    surface: "#F4F6FB"
    ink: "#1F2430"
    ink_muted: "#6B7280"
    accent: "#4F46E5"      # indigo
    accent_alt: "#0EA5E9"  # sky
    rule: "#E5E7EB"
    on_accent: "#FFFFFF"

  surfaces:
    title:   { bg: "#1F2430", ink: "#FFFFFF", muted: "#C7CCD6", accent: "#818CF8" }
    section: { bg: "#4F46E5", ink: "#FFFFFF", muted: "#D6D3FB" }

  dark:
    bg: "#171A22"
    surface: "#20242E"
    ink: "#EDEFF6"
    ink_muted: "#9AA0AD"
    accent: "#6366F1"
    accent_alt: "#38BDF8"
    rule: "#FFFFFF18"
    on_accent: "#FFFFFF"

  type:
    display:  { family: Inter,   weight: 700, size: 40, line: 1.08, tracking: -0.8 }
    heading:  { family: Inter,   weight: 700, size: 30, line: 1.12, tracking: -0.4 }
    subhead:  { family: Inter,   weight: 400, size: 15, line: 1.4,  tracking: 0 }
    body:     { family: Inter,   weight: 400, size: 13, line: 1.55, tracking: 0 }
    caption:  { family: Inter,   weight: 500, size: 10, line: 1.35, tracking: 0.2 }
    eyebrow:  { family: Inter,   weight: 700, size: 10, line: 1.2,  tracking: 1.6, transform: upper }
    stat:     { family: Inter,   weight: 700, size: 54, line: 1.0,  tracking: -1.5 }

  grid:
    margin: { top: 0.62, right: 0.7, bottom: 0.55, left: 0.7 }
    gutter: 0.30
    columns: 12
    band: { eyebrow_y: 0.62, title_y: 1.30, body_y: 2.55 }

  shape:
    radius: { card: 0.12, pill: 0.40, chip: 0.10 }
    border: { width: 0, color: "#00000000" }
    card_pad: 0.30

  shadow:
    card: { type: outer, blur: 0, offset: 0, angle: 90, color: "1F2430", opacity: 0 }

  # A wide indigo panel up the left edge — a flat colour block echoing the
  # accent, clearly different from corner-wash themes.
  background:
    decor:
      - shape: rect
        x: 0
        y: 0
        w: 0.55
        h: 7.5
        fill: "#4F46E5"
        transparency: 0
      - shape: ellipse
        x: -1.8
        y: 5.6
        w: 4.2
        h: 4.2
        fill: "#0EA5E9"
        transparency: 88

  plate:
    enabled: false

voice:
  feel: clean, straightforward, modern, efficient
  density: medium
  prefers:
    - direct, no-fuss claims
    - clear structure and simple cards
    - plain confident English
  avoid:
    - decoration and flourish
    - corporate jargon
    - more than one strong accent per slide
  headline_style: >
    Clean and direct. "Faster Than Real Time" over "An Introduction to Ray
    Tracing". Straight to the point.
  body_style: >
    Plain, clear sentences. No filler.
