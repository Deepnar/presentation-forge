name: warm-humanist
label: Warm Humanist
summary: Calm editorial warmth. Bone paper, terracotta accent, serif headlines.
tokens:
  palette:
    bg: "#EBEBE6"
    surface: "#FFFFFF"
    ink: "#2D2D2A"
    ink_muted: "#5C5C59"
    accent: "#C05D4E"
    accent_alt: "#D97706"
    rule: "#D8D8D2"
    on_accent: "#0A0A0A"
  surfaces:
    title:
      bg: "#2D2D2A"
      ink: "#FFFFFF"
      muted: "#A8A8A2"
      accent: "#D97706"
    section:
      bg: "#C05D4E"
      ink: "#FFFFFF"
      muted: "#F2DCD7"
  dark:
    bg: "#202020"
    surface: "#2C2C2C"
    ink: "#E6E6E6"
    ink_muted: "#B0B0B0"
    accent: "#C05D4E"
    accent_alt: "#D97706"
    rule: "#FFFFFF1A"
    on_accent: "#FFFFFF"
  type:
    display:
      family: Merriweather
      weight: 900
      size: 40
      line: 1.12
      tracking: -0.5
    heading:
      family: Merriweather
      weight: 700
      size: 30
      line: 1.18
      tracking: -0.3
    subhead:
      family: Inter
      weight: 400
      size: 15
      line: 1.45
      tracking: 0
    body:
      family: Inter
      weight: 400
      size: 13
      line: 1.55
      tracking: 0
    caption:
      family: Inter
      weight: 500
      size: 10
      line: 1.35
      tracking: 0.2
    eyebrow:
      family: Inter
      weight: 700
      size: 10
      line: 1.2
      tracking: 1.2
      transform: upper
    stat:
      family: Merriweather
      weight: 900
      size: 54
      line: 1
      tracking: -1
  grid:
    margin:
      top: 0.62
      right: 0.7
      bottom: 0.55
      left: 0.7
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0.24
      pill: 0.4
      chip: 0.12
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
  shadow:
    card:
      type: outer
      blur: 16
      offset: 4
      angle: 90
      color: 2D2D2A
      opacity: 0.09
  plate:
    enabled: false
voice:
  feel: calm, editorial, unhurried, confident without shouting
  density: medium
  prefers:
    - two-column comparison cards
    - a single framework/takeaway bar closing a section
    - pull-quotes and generous whitespace
    - stat trios for quantitative beats
  avoid:
    - neon or saturated primary colours
    - dense bullet walls (>5 bullets)
    - clip-art, gradients, drop shadows on text
  headline_style: >
    Declarative and specific. "Two Companies, Two Bets on Parallelism" over
    "Introduction to GPU Vendors". Never a bare noun phrase.
  body_style: >
    Full sentences, not fragments. Lead with the claim, then the evidence. Bold
    at most one phrase per paragraph.
