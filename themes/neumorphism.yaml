name: neumorphism
label: Neumorphism
summary: Soft UI with dual shadows and same-colour surfaces — calm, minimal.
tokens:
  palette:
    bg: "#E3E7EE"
    surface: "#F3F6FA"
    ink: "#3B4453"
    ink_muted: "#7E8898"
    accent: "#5A7DF0"
    accent_alt: "#9FAED8"
    rule: "#D4DAE4"
    on_accent: "#0A0A0A"
  surfaces:
    title:
      bg: "#3B4453"
      ink: "#FFFFFF"
      muted: "#B7C0CF"
      accent: "#5A7DF0"
    section:
      bg: "#5A7DF0"
      ink: "#FFFFFF"
      muted: "#DAE2FB"
  dark:
    bg: "#232830"
    surface: "#2B313B"
    ink: "#E3E7EE"
    ink_muted: "#98A2B2"
    accent: "#7E9BFF"
    accent_alt: "#8FA0C8"
    rule: "#FFFFFF1A"
    on_accent: "#FFFFFF"
  type:
    display:
      family: Manrope
      weight: 700
      size: 38
      line: 1.1
      tracking: -0.5
    heading:
      family: Manrope
      weight: 700
      size: 29
      line: 1.15
      tracking: -0.3
    subhead:
      family: Inter
      weight: 500
      size: 15
      line: 1.4
      tracking: 0
    body:
      family: Inter
      weight: 400
      size: 13
      line: 1.55
      tracking: 0
    caption:
      family: Inter
      weight: 500
      size: 10
      line: 1.35
      tracking: 0.2
    eyebrow:
      family: Inter
      weight: 600
      size: 10
      line: 1.2
      tracking: 1.2
      transform: upper
    stat:
      family: Manrope
      weight: 700
      size: 52
      line: 1
      tracking: -1
  grid:
    margin:
      top: 0.62
      right: 0.7
      bottom: 0.55
      left: 0.7
    gutter: 0.3
    columns: 12
    band:
      eyebrow_y: 0.62
      title_y: 1.3
      body_y: 2.55
  shape:
    radius:
      card: 0.32
      pill: 0.4
      chip: 0.12
    border:
      width: 0
      color: "#00000000"
    card_pad: 0.3
    card_fill:
      color: "#E3E7EE"
      transparency: 88
  plate:
    enabled: true
    html: >
      <style>
        .bg{position:absolute;inset:0;background:
          linear-gradient(150deg, {{tokens.palette.bg}} 0%, {{tokens.palette.rule}} 100%);}
        .field{position:absolute;left:{{box.x}}px;top:{{box.y}}px;width:{{box.w}}px;height:{{box.h}}px;
          border-radius:48px;background:{{tokens.palette.bg}};
          box-shadow:
            -40px -40px 72px {{tokens.palette.surface}}e6,
            40px 40px 72px {{tokens.palette.ink}}59,
            inset -20px -20px 40px {{tokens.palette.ink}}40,
            inset 20px 20px 40px {{tokens.palette.surface}}e6;}
      </style>

      <div class="bg"></div>

      <div class="field"></div>
    surfaces:
      title: >
        <style>
          .hero{position:absolute;inset:0;background:
            radial-gradient(70% 60% at 18% 18%, {{tokens.palette.accent}}77 0%, transparent 55%),
            radial-gradient(60% 50% at 84% 26%, {{tokens.palette.accent_alt}}66 0%, transparent 55%),
            linear-gradient(150deg, {{tokens.surfaces.title.bg}} 0%, {{tokens.palette.ink}} 100%);}
        </style>

        <div class="hero"></div>
      section: >
        <style>
          .sec{position:absolute;inset:0;background:
            radial-gradient(70% 60% at 18% 20%, {{tokens.surfaces.section.bg}} 0%, transparent 55%),
            radial-gradient(60% 50% at 84% 80%, {{tokens.palette.accent_alt}}77 0%, transparent 55%),
            linear-gradient(150deg, {{tokens.surfaces.section.bg}} 0%, {{tokens.palette.accent}} 100%);}
        </style>

        <div class="sec"></div>
  shadow:
    card:
      type: outer
      blur: 18
      offset: 4
      angle: 90
      color: 5A7DF0
      opacity: 0.12
voice:
  feel: calm, minimal, quiet, software that recedes
  density: low
  prefers:
    - generous whitespace
    - one idea per slide
    - soft, understated emphasis
  avoid:
    - loud gradients or saturated colour
    - dense bullet walls
    - anything that shouts
  headline_style: >
    Short, calm, confident. "Soft Interfaces" over "An Introduction to Soft
    Interfaces". Fewer words than you think you need.
  body_style: |
    Full sentences, quiet tone. Give the surface room to breathe.
