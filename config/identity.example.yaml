# TEMPLATE. Copy to config/identity.yaml and fill in — that file is gitignored
# so personal and institutional details never reach the repository.
#
# Standing defaults for every deck and report. This file holds only the
# LONG-TERM facts — institution and guide. The per-submission details
# (subject, year, semester, exam type, team) are asked in the briefing for
# each chat and frozen into the deck's own meta.yaml, never stored here.
# Everything here is overridable per-deck in decks/<slug>/meta.yaml — nothing
# is hardcoded in the renderer. Leave a field blank ("") and it is simply
# omitted from the output.

institution:
  name: "Example Institute of Technology"
  short: "EIT"
  department: "Department of Computer Engineering"
  scheme: ""
  autonomy: ""
  university: ""

guide:
  name: ""               # e.g. "Dr. A. Sharma"
  designation: "Assistant Professor"

# Which brand marks the locked chrome layer applies. Paths are relative to the
# project root and point at brand/generated/ — the normalised output of
# `node tools/prep-brand.mjs`. Drop raw files (any format) into brand/logos/
# named crest.*, banner.*, watermark.* and re-run that tool.
# Missing files are warned about, not fatal.
brand:
  banner: "brand/generated/banner.png"        # wide dept strip — title slide + report header
  crest: "brand/generated/crest.png"          # shield — top-right of content slides
  crest_light: "brand/generated/crest-light.png"  # reversed mark, for dark or saturated grounds
  crest_dark: "brand/generated/crest-dark.png"    # single-colour mark, for light chromatic grounds
  watermark: "brand/generated/watermark.png"  # faded crest — report body background

chrome:
  slide_numbers: true
  presenter_on_slides: true
  crest_on_content_slides: true
