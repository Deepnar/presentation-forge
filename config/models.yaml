# Which model plays which role, and which backend serves it.
#
# Local-first by default: every role resolves to a local Ollama model. Cloud
# backends are opt-in — define one under `providers:`, then point a role at it
# with `provider: <name>`. Nothing uses a cloud model unless a role says so.
#
# Sized against a 24 GB VRAM ceiling. The two MoE models are ~17-18 GB but only
# activate 3-4B parameters per token, so they run at small-model speed with
# large-model quality. Keep `utility` tiny — it runs often and its jobs are
# trivial.
#
#   export OLLAMA_MAX_LOADED_MODELS=2
#
# so a big model and the utility model stay resident together instead of
# thrashing on every role switch.

host: http://localhost:11434

# Optional cloud backends. `type: openai-compatible` speaks the same
# /chat/completions wire format as Ollama's /v1 endpoint, so it works with
# OpenAI, OpenRouter, Together, vLLM, LM Studio and most hosted APIs.
# `apiKey` reads from an environment variable (env:NAME) — never commit a key.
providers:
  tcet-auto:
    type: openai-compatible
    baseURL: https://ai.tcetcercd.in/v1
    apiKey: env:FORGE_TCET_API_KEY
    label: TCET CoE Gateway
    models:
      - qwen3.6
  openai:
    type: openai-compatible
    baseURL: https://api.openai.com/v1
    apiKey: env:OPENAI_API_KEY
  # OpenCode Go — the subscription gateway. OpenAI-compatible; the key is read
  # from the OPENCODE_GO_API_KEY env var or config/local.yaml (gitignored, the
  # file the app's Settings panel writes). The `models` list is what the model
  # picker offers once a key is present, and routes a `model` override to this
  # provider instead of local Ollama.
  opencode-go:
    type: openai-compatible
    baseURL: https://opencode.ai/zen/go/v1
    apiKey: env:OPENCODE_GO_API_KEY
    label: OpenCode Go
    models:
      - deepseek-v4-flash
      - qwen3.8-max
      - mimo-v2.5
  # openrouter:
  #   type: openai-compatible
  #   baseURL: https://openrouter.ai/api/v1
  #   apiKey: env:OPENROUTER_API_KEY

roles:
  # Tool-calling and query formulation. Strong instruction-following matters
  # more than prose quality.
  research:
    model: qwen3-coder:30b-a3b-q4_K_M
    temperature: 0.3
    num_ctx: 32768
    # How deeply one research pass searches and reads. These are the budgets
    # for the LOCAL pipeline — the numbers that keep a small-model author's
    # prompt inside its window. The cloud transport override (below) is the
    # whole point of the per-transport split: a cloud research role deepens
    # the pass because the cloud author that reads the notes has a far larger
    # context, so the caps that exist "because the local model can't handle
    # more" do not constrain it.
    research:
      angle_max: 8          # queries the brief expands into (incl. the brief itself)
      per_query_limit: 8    # search results considered per query
      per_query_read: 4     # pages extracted per query
      followup_sources: 3   # richest sources to follow up on
      followup_limit: 6     # search results per follow-up query
      followup_read: 3      # pages extracted per follow-up
      gap_max: 3            # examiner-gap follow-up queries
      gap_limit: 5          # search results per gap query
      gap_read: 3           # pages extracted per gap query
      papers_limit: 6       # papers kept from arXiv + Crossref
      papers_fulltext: 2    # top papers' full text pulled into the notes
    transports:
      cloud:
        # The cloud research pass runs strictly deeper: more angle queries,
        # higher source and read caps, more examiner-gap follow-ups, and more
        # papers with fuller full-text coverage.
        research:
          angle_max: 10
          per_query_limit: 12
          per_query_read: 8
          followup_sources: 5
          followup_limit: 10
          followup_read: 6
          gap_max: 5
          gap_limit: 8
          gap_read: 5
          papers_limit: 10
          papers_fulltext: 4

  # Outline and slide content. This one writes everything the audience reads.
  #
  # Measured on the same outline prompt under constrained decoding:
  #   qwen3-coder:30b-a3b   7 slides, 332 tok,  11.8s, coherent
  #   qwen3.6:27b           6 slides, 370 tok, 210.5s, coherent (dense, 18x slower)
  #   gemma4:26b-a4b-it     structurally valid, prose degenerated into token
  #                         loops ("im_er_al", "enlarge-enlarge")
  #
  # A coder model is the right instinct for schema-constrained output: JSON is
  # in-distribution for it, so the grammar rarely has to mask its next choice.
  #
  # To route this role to a cloud model instead (OpenAI-compatible provider
  # defined above, key in OPENAI_API_KEY):
  #   author:
  #     provider: openai
  #     model: gpt-4.1
  # Cloud providers get `response_format: json_object` rather than Ollama's
  # grammar, so prefer a strong model and keep schemas small.
  author:
    model: qwen3-coder:30b-a3b-q4_K_M
    temperature: 0.7
    top_k: 20
    top_p: 0.8
    repeat_penalty: 1.05
    num_ctx: 32768
    # A response that hits this cap is truncated mid-JSON and fails as
    # "malformed output". done_reason=length in the error distinguishes the two.
    # 12K rather than 8K: a large-team outline (8 sections, ~12 slides) on the
    # cloud transport can run to ~7K output tokens, and 8192 occasionally
    # truncated it mid-JSON. The local grammar keeps output bounded regardless.
    num_predict: 12000
    # How much of research/notes.md the model sees per call. 80K chars is ~23K
    # tokens against the local author's 32768 num_ctx, leaving headroom for the
    # schema and output. The cloud override raises it well past that window.
    excerpt_chars: 80000
    transports:
      cloud:
        # Cloud models legitimately output more; 24000 keeps a long outline or a
        # dense slide from being cut mid-JSON. The local grammar keeps the local
        # path bounded regardless, so this cap only ever widens the cloud side.
        num_predict: 24000
        excerpt_chars: 240000

  # Reads rendered slide PNGs. Must be a vision model.
  critic:
    model: gemma4:26b-a4b-it-q4_K_M
    temperature: 0.2
    num_ctx: 16384
    vision: true

  # Classification, title-casing, dedupe, summarisation of old chat turns.
  utility:
    model: qwen3:4b-instruct
    temperature: 0.2
    num_ctx: 8192

# Fallbacks used when a role's model is not installed. Checked in order.
fallbacks:
  - gemma4:12b
  - qwen3.6:27b
  - gpt-oss:latest

defaults:
  # Ollama unloads after this idle period. Long enough to survive a user reading
  # an outline before replying.
  keep_alive: "15m"
  request_timeout_ms: 300000
  max_retries: 2
  # When a completion reports done_reason=length (hit its token cap mid-output),
  # the transport retries the same request with the cap doubled, up to this
  # ceiling. A runaway grammar still fails cleanly once the ceiling is reached —
  # it just gets a fairer number of chances first.
  num_predict_bump_ceiling: 64000
