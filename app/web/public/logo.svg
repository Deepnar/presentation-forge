<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Presentation Forge">
  <!-- simple, high-contrast mark — works on light #F8F9FC and dark #0B0F1A -->
  <rect x="8" y="8" width="496" height="496" rx="112" fill="#6D5BFF"/>
  <rect x="8" y="8" width="496" height="496" rx="112" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="3"/>
  <!-- F — bold, white, centered for 32px legibility -->
  <g fill="#FFFFFF" font-family="Inter, sans-serif" font-weight="800" text-anchor="middle">
    <text x="256" y="325" font-size="280" letter-spacing="-12">F</text>
  </g>
  <circle cx="418" cy="168" r="22" fill="#FFB86B" stroke="white" stroke-width="6"/>
</svg>
