    <path d="M168 340 C168 310 170 288 178 274 C182 266 188 256 188 242 C188 256 194 266 202 278 C214 296 218 312 218 328 C218 348 210 360 194 360 Z" fill="url(#flameInner)" opacity="0.96"/>
    <rect x="188" y="150" width="188" height="46" rx="23" fill="#FFFFFF"/>
    <rect x="188" y="248" width="158" height="46" rx="23" fill="#FFFFFF"/>
