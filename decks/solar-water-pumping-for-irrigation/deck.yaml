title: Solar-Powered Water Pumping for Smallholder Irrigation in Karshi
subtitle: Design, Feasibility, and Implementation for a Sustainable Crop
  Production Future
sections:
  - Introduction
  - System Design
  - Feasibility & Implementation
  - Conclusion & Future
slides:
  - type: title
    section: 0
    headline: Solar Water Pumping for Smallholder Irrigation in Karshi
    standfirst: A photovoltaic-powered pump lifts 10,000 litres daily from a well to
      an elevated tank, enabling drip irrigation for 1 hectare without diesel or
      grid power.
    presenter: Design Team
    notes: "Open with the challenge: Karshi's smallholder farmers rely on rain-fed
      agriculture and manual or fuel-based irrigation during the dry season.
      This presentation introduces a solar water pumping system designed to
      supply 10,000 L/day for a 1-hectare field, based on the local insolation
      and crop water needs."
    cites: []
  - type: section
    section: 0
    headline: "Introduction: The Irrigation Challenge in Karshi"
    standfirst: Smallholder farmers in Karshi depend on rain-fed agriculture and
      manual watering—a sustainable solar solution can transform crop
      production.
    notes: "Open the Introduction section by framing the core problem: unreliable
      water access for irrigation in Karshi's smallholder farming community."
  - type: bullets
    section: 0
    headline: The Irrigation Challenge in Karshi
    standfirst: Smallholder farmers struggle to meet crop water needs during the dry
      season, relying on costly or labor-intensive methods.
    bullets:
      - Over 80% of Nigerian farmers are smallholders, most in rural communities
        like Karshi.
      - Farming is largely rain-fed; the dry season forces manual watering from
        wells, exhausting farmers.
      - Petrol and diesel pumps offer relief but bring high fuel, repair, and
        maintenance costs over time.
      - Fossil-fuel pumps also pollute soil and groundwater—and emit significant
        CO2.
      - Unreliable grid power in rural areas blocks electric pumping as a
        dependable alternative.
      - Limited energy access leaves smallholders financially and physically
        overburdened.
    notes: "Set the stage: the current irrigation practice in Karshi is
      unsustainable. Preview that solar pumping can replace manual and
      fossil-fuel methods."
    cites: []
  - type: stats
    section: 0
    headline: Why Karshi Needs Solar Irrigation
    standfirst: Smallholder farmers face water and energy challenges in the dry season
    stats:
      - value: 80%
        label: Smallholder farmers
        sub: Over 80% of Nigeria's farmers are smallholders
      - value: 0.5 ha
        label: Average land holding
        sub: Per capita land ownership in Karshi
      - value: 10,000 L
        label: Daily water demand
        sub: For 1 ha of irrigated crops
      - value: "4.22"
        label: Peak sun hours in August
        sub: kWh/m²/day, lowest insolation of the year
  - type: section
    section: 1
    headline: "System Design: From Water Demand to Pump & PV Sizing"
    standfirst: A step-by-step methodology—crop water needs, pump hydraulics, and PV
      array configuration—grounded in the Karshi feasibility study.
    notes: "Set the stage for the design sequence: daily water demand, pump
      selection, solar array sizing, and component matching."
  - type: flow
    section: 1
    headline: Sizing the Solar Pumping System
    standfirst: A six-step methodology from crop water demand to PV array configuration.
    direction: ltr
    steps:
      - title: Crop water demand
        body: Tomatoes require 9 m³/day; the system is designed for 10,000 L/day on 1
          ha.
      - title: Pump selection
        body: Lorentz PS150 C-SJ5-8 delivers 2.4 m³/h at 14.2 m total dynamic head.
      - title: Power needed
        body: Performance curve shows 258 W required to meet the operating point.
      - title: PV array oversize
        body: "Oversize by 25% to cover losses: 258 W × 1.25 = 322.5 W peak."
      - title: Panel configuration
        body: Three 110 W SunPower panels in parallel deliver 330 W, 18.8 V, 17.7 A.
      - title: Water storage
        body: 10 m³ tank buffers 3 days of demand for cloudy periods.
