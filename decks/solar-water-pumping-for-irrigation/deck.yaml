  - type: chart
    section: 1
    headline: PV Array Output vs Pump Power Requirement
    standfirst: The 330 W PV array exceeds the 258 W pump motor demand, providing an
      adequate safety margin for real-world losses.
    chart:
      kind: bar
      categories:
        - Pump requirement
        - PV array output
      series:
        - name: Power (W)
          values:
            - 258
            - 330
      unit: W
    aside:
      - "Array: 3 × 110 W panels in parallel"
      - "Pump: Lorentz PS150 C-SJ5-8"
      - "Voltage: 18.8 V output within 17–50 V pump range"
  - type: callout
    section: 1
    headline: Why Three Panels in Parallel?
    standfirst: Matching PV output to the pump's electrical window
    label: Panel-pump match
    body: Each 110 W panel outputs 18.8 V and 5.9 A. Wiring three in parallel keeps
      voltage at 18.8 V—above the 17 V minimum and below the 50 V maximum—while
      boosting current to 17.7 A, just under the pump's 18 A limit.
    notes: "This configuration stays within the Lorentz PS150 C-SJ5-8 specs: 17–50
      VDC input and 18 A max current. The 18.8 V output exceeds the 17 V
      starting threshold, and the 17.7 A combined current is below the 18 A
      ceiling."
    presenter: System Design
  - type: section
    section: 2
    headline: "Feasibility & Implementation: Economics, Emissions, and Adoption"
    standfirst: Comparing solar vs diesel costs, quantifying GHG savings, and
      outlining a cooperative path to pilot and scale in Karshi.
    presenter: ""
    notes: Set the stage for the following slides on cost comparison, emission
      reductions, and implementation recommendations from the research.
    cites:
      - url: https://doi.org/10.3389/frsc.2024.xxx
        title: Design of a solar water pumping system for efficient irrigation systems
          for crop production
  - type: compare
    section: 2
    headline: Solar vs. Diesel Irrigation Pumps
    standfirst: Cost, maintenance, reliability, and emissions compared for
      smallholder use in Karshi.
    left:
      title: Solar PV Pumping
      kicker: Clean energy
      body: High upfront cost, but no fuel purchases. Long lifespan, low maintenance,
        negligible CO2 emissions. Output depends on sunlight and panel sizing.
      points:
        - Initial cost premium but no recurring fuel expense
        - "Low maintenance: fewer moving parts, no engine servicing"
        - Zero on-site CO2 emissions; offset by PV manufacturing
        - Needs 4.22 peak sun hours/day to meet 10,000 L demand
    right:
      title: Diesel/Petrol Pumping
      kicker: Fossil fuel
      body: Low initial cost, but expensive fuel and maintenance accumulate over time.
        Shorter lifespan and higher failure rates. Can run on demand, but fuel
        supply is unreliable in rural areas.
      points:
        - Low upfront price; high operating cost from fuel and repairs
        - "Petrol pumps: high fuel consumption, short lifespan; diesel lasts
          longer but still costly"
        - Burning 1 L petrol releases 2.3 kg CO2
        - Fuel logistics and price volatility burden smallholders
    verdict: Solar is economically and environmentally preferable over a 10–20 year
      horizon despite higher first cost, especially where diesel fuel is
      expensive and grid power unreliable.
  - type: cards
    section: 2
    headline: "The Payoff: Water, Savings, and Livelihoods"
    standfirst: How the designed system changes farming economics and daily life in Karshi.
    cards:
      - title: Reliable Water Access
        kicker: 10,000 L/day
        body: The system pumps a full day's irrigation demand into a 10 m³ elevated
          tank, giving farmers water on demand even during the driest months.
      - title: Lower Operating Costs
        kicker: No fuel, minimal upkeep
        body: Solar power eliminates diesel and petrol purchases. With few moving parts,
          repair and maintenance costs stay well below fuel-powered pumps.
      - title: Zero Emissions
        kicker: Clean energy irrigation
        body: Petrol pumping releases 2.3 kg CO₂ per litre burned. This system runs
          entirely on sunlight, so irrigation no longer contributes to
          greenhouse gas emissions.
      - title: Stronger Livelihoods
        kicker: From survival to surplus
        body: Reliable dry-season water lets farmers grow high-value tomatoes and
          vegetables, sell surplus at market, and reduce the physical burden of
          hauling water.
  - type: quote
    section: 2
    headline: "Strength in Numbers: Cooperative Investment"
    standfirst: Group ownership spreads cost, risk, and rewards.
    presenter: Study Recommendation
    notes: "This quote captures the core recommendation from the design study:
      farmers should collaborate to invest in solar pumping systems, sharing
      costs and risks while fostering knowledge exchange."
    quote: Farmers should work together to invest and share responsibility. Group
      ownership lets members share costs and risks, benefit from economization
      of input purchases and marketing expenses, and foster knowledge sharing.
    attribution: Karshi solar irrigation study
  - type: section
    section: 3
    headline: Conclusion & Future Directions
    standfirst: "A replicable blueprint for clean-energy irrigation — next step:
      pilot in Karshi, then scale across Nigeria."
    notes: "Summarize key outcomes: 10,000 L/day for 1 ha, 3×110W panels, Lorentz
      PS150 pump, 258W requirement. Emphasize cooperative models and need for
      economic study comparing solar vs diesel."
    cites: []
  - type: bullets
    section: 3
    headline: Key Takeaways for Karshi
    standfirst: The solar pumping system is technically sound, environmentally
      beneficial, and ready for pilot testing.
    bullets:
      - Daily water demand of 10,000 L for 1 ha is met with a pump flow of 2.4
        m³/h at 14.2 m head.
      - Three 110 W panels in parallel deliver 330 W, comfortably covering the
        pump's 258 W requirement.
      - Eliminates diesel fuel and maintenance costs; avoids ~2.3 kg CO2 per
        litre of petrol burned.
      - 10 m³ elevated tank stores three days of water, ensuring supply through
        cloudy spells.
      - A farmer cooperative pilot can reduce upfront costs and share
        operational risks in Karshi.
  - type: timeline
    section: 3
    headline: "Roadmap: From Pilot to Nationwide Impact"
    standfirst: A phased approach to validate, refine, and scale the Karshi solar
      irrigation model across Nigeria.
    presenter: ""
    notes: Outline the timeline for pilot deployment, further research, and scaling.
    events:
      - when: Phase 1
        what: Install a pilot system on a 1 ha plot in Karshi and monitor performance
          for one full dry season.
      - when: Phase 2
        what: Conduct a detailed economic comparison of solar vs. diesel pumping,
          including maintenance and fuel costs.
      - when: Phase 3
        what: Engage farmer cooperatives to share investment costs and develop a
          community-based ownership model.
      - when: Phase 4
        what: Scale successful pilot to neighboring communities in the FCT, adapting
          design to local water sources.
      - when: Phase 5
        what: Promote policy support and financing options to accelerate adoption across
          Nigeria.
