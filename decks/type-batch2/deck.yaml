title: "Batch 2 — Data and chart types"
theme: warm-humanist
sections:
  - Data
  - Charts
slides:
  - type: title
    section: 0
  - type: kpi-dashboard
    headline: Quarterly pulse
    kpis:
      - label: Active users
        value: "48.2K"
        trend: up
        change: "+4.1%"
      - label: Churn
        value: "2.3%"
        trend: down
        change: "-0.4%"
      - label: NPS
        value: "61"
        trend: up
        change: "+3"
      - label: Open rate
        value: "38%"
        trend: flat
        change: "0"
  - type: data-cards
    headline: The system at a glance
    cards:
      - value: "10×"
        label: Peak speedup
        body: Distributed workers keep the bottleneck away from the single node.
      - value: "99.9%"
        label: Uptime
        body: Rolling deploys and automatic failover across three zones.
      - value: "12ms"
        label: Median latency
        body: Measured edge-to-core across the regional backbone.
      - value: "300+"
        label: Integrations
        body: First-party connectors plus an open SDK for the long tail.
  - type: progress-bars
    headline: Delivery status
    bars:
      - label: Research
        value: 100
        target: 100
      - label: Design
        value: 80
        target: 90
      - label: Build
        value: 55
        target: 75
      - label: Testing
        value: 30
        target: 60
      - label: Ship
        value: 10
        target: 40
  - type: ranking-list
    headline: Benchmark leaderboard
    items:
      - rank: 1
        label: Region EMEA
        detail: Two clusters, fully automated
        value: "9.4"
      - rank: 2
        label: Region APAC
        detail: Three clusters, one legacy node
        value: "8.1"
      - rank: 3
        label: Region AMER
        detail: Mixed fleet with manual ops
        value: "7.7"
      - rank: 4
        label: Region LATAM
        detail: Single cluster under capacity
        value: "5.9"
  - type: metric-comparison
    headline: Baseline versus target
    left:
      value: "180 GW"
      label: committed by 2030
    right:
      value: "95 GW"
      label: operating today
    delta: "+89%"
    body: The gap closes only if announced projects convert to final investment
      decisions at the historic rate.
  - type: sparklines
    headline: Load and temperature
    items:
      - label: CPU load
        value: "0.42"
        values: [0.1, 0.2, 0.15, 0.4, 0.35, 0.42]
      - label: Memory
        value: "68%"
        values: [52, 55, 60, 58, 64, 68]
      - label: Temp
        value: "71°C"
        values: [60, 62, 65, 68, 66, 71]
      - label: Requests
        value: "2.1K"
        values: [1.2, 1.4, 1.6, 1.5, 1.9, 2.1]
  - type: section
    headline: Charts
    section: 1
  - type: chart
    headline: Scatter of cost against scale
    section: 1
    chart:
      kind: scatter
      categories: ["A", "B", "C", "D"]
      series:
        - name: Levelised cost
          values: [1, 3, 6, 9]
  - type: chart
    headline: Radar of the evaluation axes
    section: 1
    chart:
      kind: radar
      categories: ["Cost", "Speed", "Trust", "Scale", "Usability"]
      series:
        - name: Baseline
          values: [3, 4, 2, 5, 4]
        - name: Target
          values: [5, 5, 4, 4, 5]
  - type: chart
    headline: Stacked contribution by source
    section: 1
    chart:
      kind: stacked-bar
      categories: ["2024", "2025", "2026"]
      series:
        - name: Solar
          values: [10, 14, 18]
        - name: Wind
          values: [8, 11, 15]
        - name: Hydro
          values: [5, 5, 6]
