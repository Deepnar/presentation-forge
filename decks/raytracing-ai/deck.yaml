  - type: bullets
    headline: Ray Tracing Fundamentals
    bullets:
      - Ray tracing is a rendering technique that simulates the physical path of
        light to generate realistic images.
      - It traces rays from the camera through each pixel, calculating how light
        interacts with objects in the scene.
      - Core principles include reflection, refraction, shadows, and global
        illumination for photorealistic results.
      - Each ray computes not just color, but also lighting effects like soft
        shadows and caustics.
      - Traditionally computationally expensive, requiring thousands of
        calculations per pixel for high fidelity.
      - Real-time ray tracing accelerates this process through hardware support
        and algorithmic optimizations.
    section: 0
    standfirst: Defining the core concepts behind ray tracing
    notes: This slide establishes foundational understanding of ray tracing
