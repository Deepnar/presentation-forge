title: "Green Hydrogen Economics 2026: Cost and Electrolysis Compared"
subtitle: An engineering briefing on LCOH, electrolyser choice, and the road to 2030
sections:
  - Why Green Hydrogen
  - Costs in 2026
  - Electrolysis Compared
  - Performance & Durability
  - System Integration
  - Market & Policy
  - Roadmap to 2030
  - What It Means
slides:
  - type: title
    section: 0
    headline: Why Green Hydrogen in 2026
    standfirst: "The economic case now narrows to two variables: the
      dollar-per-kilogram cost of green hydrogen and which electrolyser
      technology delivers it."
  - type: section
    section: 0
    headline: A molecule for the hard-to-abate economy
    standfirst: Steel, ammonia, shipping and long-haul chemicals need chemical
      bonds, not just electrons. Green hydrogen is the only scalable carrier
      that decarbonises them without rewriting their industrial chemistry.
  - type: stats
    section: 0
    headline: Double demand, 40% cheaper electrolysers — cost is the final barrier
    standfirst: Demand for green hydrogen more than doubles by 2026 while
      electrolyser capex falls roughly 40% from 2020 levels, leaving cost as the
      only remaining obstacle.
    notes: "Figures reflect the deck's stated thesis: demand growth and capex
      decline from 2020 to 2026."
    stats:
      - value: 2×
        label: Green hydrogen demand
        sub: by 2026 vs 2020
      - value: -40%
        label: Electrolyser capex
        sub: 2020 → 2026
    presenter: M1
  - type: section
    section: 1
    headline: The battle moves to €/kg
    standfirst: Electrolyser capex has fallen 40%, yet green hydrogen still pays a
      breakeven penalty versus grey. Costs in 2026 tracks how quickly that
      penalty closes — and which levers do the work.
    notes: "Open with the single metric that decides the sector: levelised cost of
      hydrogen. The 40% capex fall gets hydrogen to the table; the breakeven gap
      against grey is what must fall next."
  - type: big-number
    section: 1
    value: $3.0/kg
    label: LCOH at best renewable sites
    body: Electricity is the biggest line item, with capex and utilisation close
      behind — the three levers that decide whether green hydrogen competes in
      2026.
    sub: Best-in-class solar/wind locations, 2026
    presenter: M2
  - type: metric-comparison
    section: 1
    headline: "Green vs grey: a $1.4/kg gap in 2026"
    standfirst: Green hydrogen at $3.0/kg undercuts grey at $1.6/kg once carbon
      pricing closes the gap — no new electrolyser invention required.
    left:
      value: $3.0/kg
      label: Green H2 (2026)
    right:
      value: $1.6/kg
      label: Grey H2 (2026)
    delta: $1.4/kg
    body: The $1.4/kg premium is the entire remaining cost barrier. Carbon pricing
      that internalises grey hydrogen's emissions erases it, making green the
      cheaper molecule.
    notes: "Price gap is the key 2026 narrative: green costs $3.0/kg, grey $1.6/kg,
      premium $1.4/kg. With carbon pricing, the premium disappears."
    presenter: M3
  - type: section
    section: 2
    headline: Three ways to split water
    standfirst: "Alkaline, PEM, and solid oxide each win on a different axis: cost,
      flexibility, or efficiency."
    notes: This section compares the three leading electrolysis technologies and the
      trade-offs they force between capex, ramp speed, and efficiency. No
      numbers are repeated from the cost section — that comes next.
  - type: feature-grid
    section: 2
    headline: No universal electrolyser
    standfirst: Alkaline scales cheaply but runs flat; PEM sways with renewables;
      solid oxide wants waste heat — pick by duty cycle.
    items:
      - icon: ALK
        title: Alkaline
        body: Mature grid-scale workhorse; low CAPEX but narrow turndown and modest
          efficiency.
      - icon: PEM
        title: PEM
        body: Fast ramping with wide turndown; costs more and stack life is shorter than
          alkaline.
    notes: "Key trade-off: CAPEX vs flexibility vs efficiency. Decision matrix for
      user."
    presenter: M4
  - type: scorecard
    section: 2
    headline: PEM tops the weighted score as alkaline wins on capex
    standfirst: Scorecard across capex, efficiency, flexibility and scalability — no
      single route wins all four.
    notes: Scoring is a relative 1–5 rating for 2026 systems. PEM's fast
      load-following suits intermittent renewables; alkaline's low-cost,
      gigawatt-scale stacks suit steady baseload; solid oxide needs more
      development on flexibility and scale.
    criteria:
      - label: Capex
        weight: 25%
      - label: Efficiency
        weight: 25%
      - label: Flexibility
        weight: 30%
      - label: Scalability
        weight: 20%
    options:
      - name: Alkaline
        scores:
          - 5
          - 3
          - 2
          - 4
      - name: PEM
        scores:
          - 3
          - 4
          - 5
          - 3
      - name: Solid oxide
        scores:
          - 2
          - 5
          - 1
          - 2
    presenter: M5
  - type: section
    section: 3
    headline: The 10-year cost hidden in degradation
    standfirst: Stack efficiency and cell degradation, not nameplate megawatts,
      decide whether a plant still makes money at year ten. This section looks
      at the two variables that quietly rewrite the €/kg ledger.
  - type: data-table
    section: 3
    headline: 2026 stack economics live in the degradation spread
    standfirst: Efficiency and life are table stakes; the 0.3–0.6%/kh degradation
      band is what actually sets the replacement clock.
    columns:
      - label: Metric
        align: left
      - label: 2026 range
        align: center
      - label: Replacement impact
        align: left
    rows:
      - text:
          - System efficiency
          - 55–63%
          - Higher efficiency cuts the electricity cost per kg
        highlight: false
      - text:
          - Stack life
          - 60–80 kh
          - The upper end stretches the replacement interval by about a third
        highlight: false
      - text:
          - Degradation
          - 0.3–0.6%/kh
          - A doubled degradation rate halves effective stack life
        highlight: true
      - text:
          - Replacement schedule
          - Technology-dependent
          - Degradation rate, not rated life, drives when stacks are swapped
        highlight: false
    presenter: M6
  - type: progress-bars
    section: 3
    headline: "Stack lifetime and efficiency: where 2026 lands"
    standfirst: Relative to the 2026 baseline specification, alkaline keeps its
      service-life lead; PEM alone clears the flexibility requirement.
    notes: Indices are relative scores against the 2026 baseline spec; absolute
      hours and efficiency values are in the data-table slide.
    bars:
      - label: Alkaline service life
        value: 100
        target: 100
      - label: PEM service life
        value: 70
        target: 100
    presenter: M7
  - type: section
    section: 4
    headline: The stack is only the beginning
    standfirst: Grid connection, water treatment, compression and cooling — the
      balance of plant often rivals the electrolyser itself. System integration
      decides whether a project hits its €/kg target.
    notes: "This section moves from the cell to the plant: AC/DC conversion,
      transformer, water demineralisation, gas drying, thermal management, grid
      connection fees, land and permitting. A developer's real capex is the sum
      of these, not the stack price."
  - type: pipeline
    section: 4
    headline: "Power to storage: five gates where 2026 choices shift €/kg"
    standfirst: Electrolyser capex fell 40%, yet the $1.4/kg green-grey gap is set
      beyond the stack.
    notes: "Walk the chain left to right. At each gate, name the design choice: PPA
      indexation, stack degradation vs. capex, modular BoP, pressure matching,
      and cavern co-location. Emphasise that the $1.4/kg gap is not set by the
      electrolyser alone but by the surrounding system."
    stages:
      - title: Power
        body: 2026 PPA terms set the cost floor before hydrogen exists.
        gate: PPA price
      - title: Electrolyser
        body: Electrolyser capex is down 40%, but degradation spread sets the lifetime
          €/kg.
        gate: Lifetime €/kg
      - title: Balance-of-plant
        body: Modular BoP design trims the auxiliary capex share.
        gate: Capex share
    presenter: M8
  - type: section
    section: 5
    headline: The $1.4/kg gap that only policy can close
    standfirst: Carbon prices attack the grey premium, subsidies cut green capex,
      and offtake mandates guarantee demand — 2026's €/kg depends on how fast
      these three align, not on the stack alone.
    notes: Transition from cost and technology to market and policy. Emphasise that
      the remaining green premium is a policy problem, not an engineering one.
    speaker_note: "Frame: the cost curves we've seen meet a policy curve. The green
      premium closes where carbon pricing, subsidy design, and demand mandates
      intersect."
  - type: kpi-dashboard
    section: 5
    headline: The 2026 investment case rests on three policy levers
    standfirst: Auction strike prices secure demand; CO2 pricing sets the
      green-over-grey premium; electrolyser deployment targets turn scale into
      cheaper capex.
    notes: CO2 price, H2 auction strike prices and deployment targets each feed the
      same €/kg outcome. The KPIs are the decisive variables on which the
      investment case hinges.
    kpis:
      - label: CO2 price bridge
        value: $1.4/kg
        trend: down
        change: green-grey
      - label: H2 auction demand
        value: 2x
        trend: up
        change: strike
      - label: Electrolyser target
        value: -40%
        trend: down
        change: capex
    presenter: M9
  - type: section
    section: 6
    headline: The bridge from pilot to terawatt
    standfirst: Electrolysers are 40% cheaper and the green-grey gap is $1.4/kg —
      2026 is where the cost curve starts to bend, and the next four years
      decide whether it bends far enough.
    notes: "Introduce the Roadmap to 2030 section. Frame 2026 as the inflection
      point: pilot projects have proven the technology, and cost reductions now
      make scale a policy and execution challenge, not an engineering one."
  - type: section
    section: 7
    headline: What the data says for your next electrolyser order
    standfirst: When 2026 capex, degradation and system integration are weighed
      together, the engineering decision is no longer a chemistry debate — it's
      a procurement call with a $1.4/kg swing on the table.
  - type: takeaway
    section: 7
    headline: "The 2026 rule: match the stack to the electron, not the label"
    standfirst: Alkaline wins on capex, PEM on flexibility — the $1.4/kg gap closes
      only where carbon pricing pays.
    body: No universal winner. Site-specific electricity profile dictates the stack;
      projects below $3/kg LCOH need carbon pricing to close the gap.
    points:
      - "Alkaline: lowest capex, suits flat baseload renewable supply."
      - "PEM: faster ramping, top weighted score for variable grids."
      - Carbon pricing worth $1.4/kg turns green from premium to parity.
      - Target projects with LCOH < $3/kg; policy levers decide viability.
    label: Key takeaway
    presenter: M10
  - type: closing
    section: 7
    headline: The 2026 cost curve is a wiring problem
    standfirst: Integration with cheap renewables, not a single stack breakthrough,
      decides the €/kg.
    body: The $1.4/kg gap to grey hydrogen narrows at the grid edge — in how PEM,
      alkaline and SOEC stacks are matched to intermittent electrons, and
      through the power-to-storage gates that shift 2026 economics. That
      engineering, not the next catalyst, is what wins tenders.
    cta: Specify the power interface, not the label.
