slides:
  - type: title
    section: 0
    headline: First Impressions & Networking
    standfirst: "A practical playbook for college students: master body language,
      make confident introductions, and navigate cultural context to build
      connections that last."
    notes: "Welcome the audience. Briefly introduce the team and the journey: first
      impressions, body language, introductions, cultural context, and
      networking in practice."
  - type: section
    section: 0
    headline: Every conversation starts before the first word
    standfirst: Why the opening moments set the terms for trust and rapport — and
      how this session moves from body language to introductions, cultural
      context, networking, and the missteps that undo a strong start.
  - type: agenda
    section: 0
    headline: Eight sections that shape a lasting first impression
    standfirst: From the first glance to the last handshake, this session maps the
      sequence in eight steps — each one a skill you can practise.
    presenter: M1
    items:
      - title: Opening
        desc: Why first impressions form in seconds and stick
      - title: First Impressions
        desc: The science of snap judgments and how to use it
      - title: Body Language
        desc: Posture, gestures, and the signals you send without words
      - title: Introductions
        desc: Names, handshakes, and the art of the smooth opening
  - type: section
    section: 1
    headline: First impressions happen before you speak
    standfirst: "Within moments of meeting, your brain has already answered three
      questions: Can I trust this person? Are they competent? Do I want to
      connect?"
    notes: Transition into the science of thin-slicing and snap judgments. Research
      shows people form stable trait impressions from brief encounters, often in
      under a second.
  - type: stats
    section: 1
    headline: First impressions are largely nonverbal and nearly instant
    standfirst: Before you say a word, people have already decided how they feel about you.
    stats:
      - value: 7 sec
        label: Time to form a first impression
        sub: How long it takes someone to size you up
      - value: 93%
        label: Of communication is nonverbal
        sub: Tone, posture, and expression carry the message
      - value: 55%
        label: Visual cues dominate
        sub: Body language outweighs words and tone combined
    presenter: M2
  - type: section
    section: 2
    headline: The silent sentence of posture, gesture, and gaze
    standfirst: Before the first word, your body has already made a claim about your
      confidence and your intent.
    notes: Open by pointing out how quickly people form judgments based on posture,
      hand movements, and eye contact.
  - type: icon-list
    section: 2
    headline: Your body is already talking
    standfirst: Five cues — posture, gaze, hands, smile, space — that set the tone
      before hello.
    items:
      - icon: 🧍
        text: "Stand tall: posture signals confidence before you say a word."
      - icon: 👁️
        text: "Hold eye contact: a steady gaze builds trust, but break it naturally."
      - icon: ✋
        text: "Show hands: open palms read as honest, hidden hands read as guarded."
      - icon: 😊
        text: "Lead with a smile: a genuine smile is the fastest warmth signal."
      - icon: ↔️
        text: "Respect space: close enough to connect, far enough to be comfortable."
    presenter: M3
  - type: before-after
    section: 2
    headline: "Closed vs. open: the posture of confidence"
    standfirst: In a one-to-one, your body either withdraws or claims the room.
    before:
      title: Closed
      body: Arms crossed, shoulders hunched, gaze dropped — the body folds inward,
        signalling defensiveness and uncertainty.
    after:
      title: Open
      body: Shoulders back, arms relaxed, steady eye contact — the body expands,
        signalling ease and self-assurance.
    notes: "[image] side-by-side silhouettes of closed and open posture"
    speaker_note: Point out that these two states are readable within seconds and
      set the tone for the whole interaction.
    presenter: M4
  - type: section
    section: 3
    headline: "Introductions: the script that sets the tone"
    standfirst: How you deliver your name — and how you receive theirs — decides
      whether the conversation stays on the surface or goes deeper.
    notes: Open the Introductions section. Cover self-introduction structure (name,
      role, hook), the two-second reciprocity of a handshake and eye contact,
      and practical name-remembering techniques such as repetition, association,
      and immediate use.
  - type: numbered-list
    section: 3
    headline: Five beats to a self-introduction that sticks
    standfirst: "A self-introduction is the handshake of words: it makes you
      memorable or forgettable in one breath."
    presenter: M5
    items:
      - Say your name slowly and clearly — clarity beats speed.
      - "Add one line of context: your role or why you're here tonight."
      - Make your value concrete — what you do or the problem you solve.
      - Share a connection to the listener — a shared interest or a common
        thread.
      - End with a forward-looking question — 'What brings you here?' or 'Shall
        we continue this after?'
  - type: checklist
    section: 3
    headline: "Walk in ready: the five-second pre-flight"
    standfirst: Readiness beats reaction — a quick mental checklist makes the first
      exchange deliberate, not accidental.
    items:
      - text: "Set your posture before the door: shoulders back, chin level, chest open"
        checked: true
      - text: Warm your expression — a genuine smile reaches the eyes, not just the
          mouth
        checked: true
      - text: "Plan the first glance: meet eyes within two seconds, hold for the nod"
        checked: true
      - text: "Prepare a firm, dry handshake: full palm, two pumps, release cleanly"
        checked: true
      - text: Decide on your opener in advance — a question beats a statement
        checked: true
      - text: Repeat the other person's name once in the first minute
        checked: true
      - text: Silence your phone and angle it out of sight before you approach
        checked: true
    notes: This checklist is the preparation beat before any first encounter; each
      item is a concrete action the presenter can demonstrate.
    presenter: M6
  - type: section
    section: 4
    headline: Culture writes the subtext of every introduction
    standfirst: A firm handshake, a smile, or a pause means one thing in São Paulo
      and another in Tokyo — the same moves that win trust at home can cost it
      abroad.
    notes: Pivot from universal body language to the cultural lens. Invite the
      audience to recall a time a gesture was read differently than intended.
  - type: feature-grid
    section: 4
    headline: The same gesture, different meaning
    standfirst: The same move that wins trust at home can cost it abroad — check the
      gesture before you travel.
    items:
      - icon: 👁
        title: Eye contact
        body: Direct gaze signals respect in the U.S.; in Japan and Korea, prolonged eye
          contact can feel confrontational.
      - icon: 🤝
        title: Handshake
        body: Firm grip = confidence in the U.S. and Germany; a softer hand is polite in
          Japan, where a hard grip can feel aggressive.
    presenter: M7
  - type: section
    section: 5
    headline: "Networking: the follow-through that turns a hello into a connection"
    standfirst: A first impression gets you noticed; a deliberate follow-up gets you
      remembered. This section is about the moves after the handshake that make
      the contact count.
  - type: stacked-list
    section: 5
    headline: Networking is follow-through, not luck
    standfirst: "Strategy beats charm: each move builds a visible path from stranger
      to ally."
    items:
      - title: Work the room backwards
        body: Pick a handful of real people to meet…
        tag: Events
      - title: Profile as handshake
        body: A current photo, a specific headline…
        tag: Online
      - title: Advice over favors
        body: Ask for a short conversation with a…
        tag: Interviews
      - title: Follow up with a detail
        body: Send a note that names one thing you…
        tag: Follow-up
    presenter: M8
  - type: pipeline
    section: 5
    headline: "From hello to relationship: a five-gate pipeline"
    standfirst: Each stage has a gate to pass before the next — networking is a
      process, not a lottery.
    stages:
      - title: First contact
        body: Warm hello plus a named hook from their world.
        gate: Rapport? (≤16)
      - title: Exchange
        body: Share a specific point, ask a real question.
        gate: Common ground?
      - title: Follow-up
        body: One tailored note referencing your conversation.
        gate: Replied?
      - title: Value add
        body: Send an article or intro tied to their goal.
        gate: Useful?
    notes: "Each gate is a yes/no check: if the answer is no, don't force the next
      stage."
    presenter: M9
  - type: section
    section: 6
    headline: How a good first impression goes bad
    standfirst: "The behaviours that erase a strong start: a scripted introduction,
      a fixed smile, a follow-up that never lands."
  - type: pros-cons
    section: 6
    headline: The polished act cracks; authenticity holds
    standfirst: Skeptics forgive a genuine flub faster than a scripted line—because
      the script is what they are trained to spot.
    pros:
      - People detect rehearsed behavior in under a second; authenticity needs
        no mask to maintain.
      - A real admission of uncertainty builds credibility that a perfect line
        never earns.
      - When you are yourself, your body language aligns with your words—no
        leakage to manage.
      - Authentic listening lets the other person speak first, turning an
        introduction into a conversation.
      - A genuine stumble humanizes you; perfection is suspicious, imperfection
        is relatable.
    cons:
      - Over-rehearsed introductions sound transactional—'Hi, I'm X, and here is
        why I matter.'
      - A polished performance raises expectations you must keep up for the rest
        of the meeting.
      - Scripted small talk dies when the conversation leaves the path; you are
        left improvising.
      - Name-dropping and impressive titles read as compensation, not confidence.
      - Hiding behind a role prevents the connection you came for; people bond
        with people, not personas.
    speaker_note: "Ask the room: have you ever caught yourself delivering a scripted
      intro and then forgetting the other person's name? Preparation is not the
      enemy; performing a role is."
    presenter: M10
  - type: section
    section: 7
    headline: What sticks is not polish—it's presence
    standfirst: The research-backed behaviours that make a first impression last,
      distilled into moves you can use tomorrow.
  - type: takeaway
    section: 7
    headline: Presence is a practice, not a trick
    standfirst: The four moves that make a first impression repeatable—and real.
    body: "A strong first impression isn't a performance—it's a repeatable sequence:
      open body language, a clear introduction, cultural awareness, and a
      genuine follow-up."
    points:
      - Open posture and eye contact say approachable before you speak
      - A structured introduction gives people hooks to remember you
      - Adapt gestures and titles to culture—same move, different meaning
      - The real connection forms in the follow-up, not the hello
    label: Key takeaway
    notes: "Close by returning to the opening line: every conversation starts before
      the first word—and you now control that start."
    presenter: M11
  - type: closing
    section: 7
    headline: Thank you — presence begins now
    standfirst: The conversation doesn't end on this screen; it carries into every
      hello you give tonight.
    body: A first impression is not about polish or performance. It's about showing
      up with intention — posture open, introductions clear, culture respected,
      follow-through real. You already have every tool you need. Now go use
      them.
    cta: Let's connect
    notes: Thank the audience. Invite questions, and mention the team is available
      at the front or via the contact details in the deck.
