title: "Batch 6 — Callout, image and table types"
theme: warm-humanist
sections:
  - Calls
  - Visuals
  - Tables
slides:
  - type: title
    section: 0
  - type: warning
    headline: Before you begin
    label: Caution
    body: Do not skip the calibration step — an uncalibrated rig invalidates the
      whole batch and the error only shows up weeks later in the analysis.
    section: 0
  - type: tip
    headline: Make it easier
    label: Tip
    body: Keep the source archive in the same folder as the deck so the research
      pass and the final render always agree.
    section: 0
  - type: takeaway
    headline: What matters
    label: Key takeaway
    body: The constraint is project finance and grid access, not the technology.
    points:
      - Costs fall in step with renewables
      - Policy unlocks the financing
      - Grid build-out is the pacing item
    section: 0
  - type: section
    headline: Visuals
    section: 1
  - type: image-grid
    headline: Site photographs
    images:
      - src: green.png
        caption: North plot
      - src: red.png
        caption: South plot
      - src: wide.png
        caption: Overview
      - src: green.png
        caption: Detail
    section: 1
  - type: hero-image
    headline: The field at dawn
    subtitle: A project note from the first survey season.
    image: wide.png
    section: 1
  - type: split-screen
    headline: Two systems side by side
    left: green.png
    right: red.png
    left_caption: Baseline
    right_caption: With treatment
    section: 1
  - type: section
    headline: Tables
    section: 2
  - type: data-table
    headline: Quarterly figures
    columns:
      - label: Metric
      - label: Q1
        align: right
      - label: Q2
        align: right
    row_labels: [Revenue, Costs, Margin]
    rows:
      - text: ["1.4M", "1.2M", "1.8M"]
        highlight: true
      - text: ["0.9M", "0.8M", "1.1M"]
      - text: ["35%", "33%", "39%"]
    section: 2
  - type: decision-matrix
    headline: Choosing the platform
    criteria:
      - label: Cost
        weight: 2
      - label: Time to value
        weight: 1
      - label: Fit
        weight: 3
    options:
      - name: Vendor A
        scores: [4, 5, 3]
      - name: Vendor B
        scores: [3, 3, 5]
      - name: Vendor C
        scores: [5, 4, 2]
    section: 2
