  - type: compare
    headline: Cost Implications and Economic Viability
    left:
      title: Alkaline Electrolysis
      body: Lower initial investment costs due to use of nickel catalysts. Less
        efficient, requiring more energy input per kilogram of hydrogen
        produced. Economically viable for large-scale, base-load operations
        where electricity costs are low.
      points:
        - "Initial capital cost: $300-$500/kW"
        - "Energy efficiency: ~70%"
        - "Operating costs: Moderate"
        - "Best for: Large-scale, stable production"
      image: alkaline_electrolyzer.jpg
    right:
      title: PEM Electrolysis
      body: Higher initial capital costs due to platinum-group metal catalysts. More
        efficient and capable of higher current densities. Better suited for
        variable renewable energy sources that require rapid response
        capabilities.
      points:
        - "Initial capital cost: $1,200-$1,500/kW"
        - "Energy efficiency: ~80%"
        - "Operating costs: Higher due to catalysts"
        - "Best for: Variable renewables, frequent ramping"
      image: PEM_electrolyzer.jpg
    verdict: Alkaline electrolysis is more cost-effective for large-scale, stable
      operations, while PEM electrolysis offers better performance and
      flexibility at higher capital costs. The choice depends on energy source
      characteristics and operational requirements.
