  - type: bullets
    headline: Key Definitions and Concepts in Water Electrolysis
    bullets:
      - Water electrolysis uses electricity to split H2O into hydrogen (H2) and
        oxygen (O2) gases
      - Pure water conducts electricity poorly without added electrolyte (salt,
        acid, or base)
      - "Electrolysis occurs at two electrodes: cathode (negative) where H2 is
        produced, anode (positive) where O2 is produced"
      - Standard cell potential is 1.23 V, but real systems require higher
        voltage due to overpotential
      - Overpotential accounts for activation energy barriers and non-ideal
        process losses
      - Efficiency measures energy input per unit of hydrogen produced,
        typically 50-80% for commercial systems
    section: 0
    standfirst: Foundational principles of water splitting technology
    presenter: Research Analyst
    notes: These concepts form the basis for understanding electrolyzer performance
      and comparisons between technologies.
    cites: []
  - type: quote
    quote: Water electrolysis stands as the cornerstone technology for producing
      green hydrogen, offering a pathway to decarbonize industries where fossil
      fuel alternatives are not viable.
    attribution: International Energy Agency
  - type: bullets
    headline: Basic Water Splitting Reaction
    caption: Diagram showing the fundamental electrochemical process of water
      splitting into hydrogen and oxygen.
    bullets:
      - Water electrolysis splits H2O into hydrogen and oxygen gases.
      - "At the cathode (negative electrode): H+ ions gain electrons to form H2
        gas."
      - "At the anode (positive electrode): Water molecules lose electrons to
        form O2 gas."
      - "The overall reaction is: 2H2O → 2H2 + O2"
