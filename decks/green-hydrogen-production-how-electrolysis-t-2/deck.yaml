  - type: timeline
    headline: Key Milestones in Electrolysis Development
    events:
      - when: "1789"
        what: Jan Rudolph Deiman and Adriaan Paets van Troostwijk use electrostatic
          machine to produce electricity for water electroly
      - when: "1800"
        what: Alessandro Volta invents the voltaic pile; William Nicholson and Anthony
          Carlisle use it to electrolyze water
      - when: "1806"
        what: Humphry Davy reports water electrolysis experiments; nitric acid forms at
          the anode from dissolved nitrogen
      - when: "1869"
        what: Zénobe Gramme invents the Gramme machine, making electrolysis a cheap
          method for hydrogen production
      - when: "1888"
        what: Dmitry Lachinov develops industrial synthesis of hydrogen and oxygen
          through electrolysis
      - when: 1900s-1930s
        what: Alkaline water electrolysis becomes established in chemical industry for
          large-scale hydrogen production
    section: 1
