    section: 2
    headline: Electrolysis Technologies Overview
    standfirst: An overview of the main electrolysis technologies currently in use
    presenter: "Green Hydrogen Production: How Electrolysis Technologies Compare"
    notes: "This slide introduces the three primary electrolysis technologies used
      today: alkaline, proton exchange membrane (PEM), and solid oxide. It sets
      the stage for comparing their characteristics, efficiencies, and
      applications in hydrogen production."
    cites: []
  - type: compare
    headline: Comparing Major Electrolysis Technologies
    left:
      title: Alkaline Electrolysis
      body: Uses alkaline electrolyte (KOH or NaOH) in liquid form. Operates at lower
        temperatures (60-80°C) and pressures (10-20 bar). Employes nickel-based
        catalysts, making it cost-effective but less efficient. Requires
        diaphragm to separate gases.
      points:
        - "Operating temperature: 60-80°C"
        - "Pressure: 10-20 bar"
        - "Catalyst: Nickel-based"
        - "Efficiency: ~70-75% (lower)"
      image: alkaline_electrolyzer.jpg
    right:
      title: PEM Electrolysis
      body: Uses proton exchange membrane (PEM) to separate reactants and transport
        protons. Operates at higher temperatures (60-80°C) but can handle higher
        pressures (up to 200 bar). Employs platinum-based catalysts, offering
        higher efficiency but at increased cost. No diaphragm required.
      points:
        - "Operating temperature: 60-80°C"
        - "Pressure: Up to 200 bar"
        - "Catalyst: Platinum-group metals"
        - "Efficiency: ~75-80% (higher)"
      image: PEM_electrolyzer.jpg
    verdict: PEM electrolysis offers higher efficiency and pressure capability but
      requires expensive catalysts. Alkaline electrolysis is cheaper but less
      efficient and requires diaphragms.
  - type: cards
    headline: "Electrolysis Technologies: Detailed Overview"
    cards:
      - title: Alkaline Water Electrolysis
        body: Uses alkaline electrolytes (KOH or NaOH) in liquid form. Features a
          diaphragm separating electrodes and transports hydroxide ions. Known
          for long history, robustness, and cost-effectiveness, though less
          efficient than PEM technology.
        kicker: Established Technology
        image: alkaline-electrolysis.png
      - title: Proton Exchange Membrane (PEM)
        body: Employs a solid polymer membrane that conducts protons while blocking
          electrons. Uses expensive platinum catalysts but offers high
          efficiency, fast response, and ability to operate at higher current
          densities. Suitable for applications requiring rapid load changes.
        kicker: High Efficiency Technology
        image: peem-electrolysis.png
      - title: Anion Exchange Membrane (AEM)
        body: Utilizes an anion-exchange membrane allowing hydroxide ion conduction.
          Eliminates need for expensive noble metal catalysts, using
          cost-effective transition metals instead. Offers potential for lower
          costs and improved sustainability in large-scale applications.
        kicker: Cost-Effective Alternative
        image: aem-electrolysis.png
      - title: Supercritical Water Electrolysis (SWE)
        body: Operates water in supercritical state (>375°C), reducing energy
          requirements and increasing efficiency. Offers high current density
          operation and reduced dependence on precious metal catalysts, though
          commercial availability is limited as of 2021.
        kicker: Emerging High-Temperature Solution
        image: supercritical-electrolysis.png
