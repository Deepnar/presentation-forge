  - type: cards
    headline: Pioneers of Electrolysis
    cards:
      - title: Johann Wilhelm Ritter
        body: Invented the first electrolyser device in 1800, laying the groundwork for
          modern water electrolysis.
        kicker: Early Innovator
      - title: Alessandro Volta
        body: Invented the voltaic pile, providing the electrical power needed for water
          electrolysis experiments.
        kicker: Electrical Power Source
      - title: William Nicholson & Anthony Carlisle
        body: First successfully demonstrated water electrolysis using Volta's battery
          in 1800.
        kicker: Practical Demonstration
      - title: Humphry Davy
        body: Conducted extensive distilled water electrolysis experiments, identifying
          key chemical processes and proposing nitric acid formation at the
          anode.
        kicker: Scientific Analysis
