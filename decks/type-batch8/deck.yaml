  - type: equation
    headline: Levelised cost of hydrogen
    formula: LCOH = (CAPEX · CRF + OPEX) / H₂ output
    body: The levelised cost averages total lifetime cost over the hydrogen the
      plant actually produces, so utilisation is the dominant lever.
    variables:
      - symbol: CAPEX
        meaning: capital expenditure
      - symbol: CRF
        meaning: capital recovery factor
      - symbol: OPEX
        meaning: operating expenditure
    section: 2
