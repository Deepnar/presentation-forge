# Smoke-test deck: exercises every slide type against the reference theme.
# Content lifted from the GPU Architectures deck so output can be diffed
# against reference/GPU Architectures - NVIDIA vs AMD.pptx-3.pdf by eye.

title: "Compare GPU Architecture: NVIDIA vs AMD"
subtitle: "Two companies, two bets on parallelism"
theme: warm-humanist

sections:
  - The Silicon Philosophy
  - Core Architecture
  - Memory & Bandwidth
  - The Software War
  - Verdict

slides:
  - type: title

  - type: compare
    section: 0
    headline: Two Companies, Two Bets on Parallelism
    standfirst: >
      A GPU is thousands of small cores working at once. NVIDIA and AMD accepted
      the same premise but built two very different companies around it.
    left:
      title: NVIDIA
      kicker: Founded 1993 · Santa Clara, CA
      body: >
        Started as a gaming graphics chip maker, then bet the company on CUDA in
        2006 — a programming layer that let any scientist run general-purpose
        math on a GPU. That single bet turned a gaming chipmaker into the
        backbone of modern AI.
    right:
      title: AMD
      kicker: Founded 1969 · GPUs via ATI (2006)
      body: >
        A chip company first, GPU maker second. AMD builds both CPUs and GPUs,
        pushing toward fused chips (APUs) and open standards. Its edge today is
        cost-efficient chiplet manufacturing rather than a closed software moat.
    verdict: >
      NVIDIA optimizes a closed stack for maximum performance; AMD optimizes an
      open stack for maximum reach. Every architectural choice traces back here.

  - type: section
    section: 1
    headline: Core Architecture
    standfirst: How each vendor tiles a small execution cluster across the die.

  - type: table
    section: 1
    headline: SM versus CU, side by side
    columns: [Parameter, NVIDIA, AMD]
    rows:
      - [Execution model, "SIMT — 32-thread warp in lockstep per SM", "SIMD — 32/64-wide wavefront per CU"]
      - [Flagship (2022-23), "RTX 4090 — 128 SMs, 16,384 CUDA cores", "RX 7900 XTX — 96 CUs, 6,144 stream processors"]
      - [Ray tracing, "3rd-gen RT Cores for BVH traversal", "Ray Accelerators inside each CU"]
      - [AI upscaling, "Tensor Cores + DLSS (proprietary, neural)", "FSR (open-source, algorithmic)"]
      - [Manufacturing, "Monolithic — best performance, costly yields", "Chiplets — small cheap dies stitched together"]

  - type: stats
    section: 1
    headline: The core-count gap
    standfirst: Raw parallel width at the 2022-23 flagship tier.
    stats:
      - { value: "16,384", label: CUDA cores, sub: "RTX 4090 · 128 SMs" }
      - { value: "6,144", label: Stream processors, sub: "RX 7900 XTX · 96 CUs" }
      - { value: "2.7×", label: Raw core advantage, sub: "Offset by AMD dual-issue FP32" }

  - type: chart
    section: 2
    headline: Memory bandwidth across generations
    chart:
      kind: bar
      categories: ["RTX 3090", "RTX 4090", "RX 6900 XT", "RX 7900 XTX"]
      unit: GB/s
      series:
        - name: Peak bandwidth (GB/s)
          values: [936, 1008, 512, 960]
    aside:
      - More cores are useless if data cannot reach them fast enough.
      - NVIDIA pairs high-bandwidth memory with a massive L2 cache.
      - AMD's chiplet design places memory closer to compute via Infinity Fabric.

  - type: flow
    section: 2
    headline: How a frame reaches the screen
    direction: ltr
    steps:
      - { title: Geometry, body: Vertices transformed into clip space }
      - { title: Rasterize, body: Triangles mapped to candidate pixels }
      - { title: Shade, body: Per-pixel colour computed in parallel }
      - { title: Upscale, body: DLSS or FSR reconstructs full resolution }

  - type: bullets
    section: 3
    headline: Why CUDA still wins
    standfirst: The software moat is deeper than the silicon gap.
    bullets:
      - CUDA has a fifteen-year head start and is the default target for PyTorch and TensorFlow.
      - ROCm was historically unstable, but PyTorch 2.0 integration made AMD viable for ML.
      - Framework support, not raw FLOPs, decides what researchers actually buy.
      - AMD competes on price-per-FLOP where the software stack is not the bottleneck.

  - type: timeline
    section: 3
    headline: Fifteen years of lock-in
    events:
      - { when: "2006", what: "CUDA released; general-purpose GPU compute begins" }
      - { when: "2016", what: "Deep learning boom makes CUDA the de facto standard" }
      - { when: "2016", what: "AMD launches ROCm as an open alternative" }
      - { when: "2023", what: "PyTorch 2.0 ships usable ROCm support" }

  - type: quote
    section: 4
    quote: >
      The future of graphics and AI will be shaped by whoever wins the balance
      between raw silicon physics and the software that controls it.
    attribution: Report conclusion

  - type: callout
    section: 4
    headline: Where this lands
    label: Bottom line
    body: >
      NVIDIA's closed performance stack dominates AI and graphics today; AMD's
      open accessibility and chiplet economics define the competitive
      battleground of the next generation of parallel compute.

  - type: references
    section: 4
    headline: References
    items:
      - "NVIDIA Corporation. Ada Lovelace GPU Architecture Whitepaper, 2022."
      - "AMD. RDNA 3 Instruction Set Architecture Reference Guide, 2023."
      - "Jia, Z. et al. Dissecting the NVIDIA Ampere GPU Architecture, 2021."
