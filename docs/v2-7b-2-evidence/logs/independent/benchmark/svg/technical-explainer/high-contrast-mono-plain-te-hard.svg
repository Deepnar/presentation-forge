<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="#FFFFFF"/><g data-el="te-hard:title:heading"><text x="76.8" y="117.2" text-anchor="start" font-size="61.3" fill="#000000" font-family="Anton" font-weight="bold">Manufacturing, not chemistry</text></g><g data-el="te-hard:takeaway:headline"><text x="76.8" y="195.6" text-anchor="start" font-size="21.3" fill="#000000" font-family="Space Grotesk" font-weight="bold">The factory is harder than the formula</text></g><rect data-el="te-hard:te-hard-b1:frame" data-semantic-ref="te-hard-b1" x="76.8" y="241.0" width="1126.4" height="342.7" rx="10" fill="#FFFFFF"/><g data-el="te-hard:te-hard-b1:content" data-semantic-ref="te-hard-b1"><text x="115.2" y="279.9" text-anchor="start" font-size="18.7" fill="#000000" font-family="Space Grotesk" font-weight="400">Cold-pressing stacks at scale is the open hard problem.</text></g><g data-el="te-hard:te-hard-b1:caveat" data-semantic-ref="te-hard-b1"><text x="115.2" y="547.4" text-anchor="start" font-size="14.7" fill="#000000" font-family="Space Grotesk" font-weight="bold" letter-spacing="0.13">QUALIFIED</text></g></svg>