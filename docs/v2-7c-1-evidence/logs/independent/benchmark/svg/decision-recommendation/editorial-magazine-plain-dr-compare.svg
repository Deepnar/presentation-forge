<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="#FAF7F0"/><g data-el="dr-compare:title:heading"><text x="67.2" y="109.1" text-anchor="start" font-size="56.0" fill="#1B1B1B" font-family="Playfair Display" font-weight="bold" letter-spacing="-1.07">Sulfide vs oxide</text></g><rect data-el="dr-compare:dr-compare-s:frame" data-semantic-ref="dr-compare-s" x="67.2" y="169.9" width="553.6" height="145.6" rx="10" fill="#FFFFFF"/><g data-el="dr-compare:dr-compare-s:content" data-semantic-ref="dr-compare-s"><text x="96.0" y="207.8" text-anchor="start" font-size="17.3" fill="#1B1B1B" font-family="Inter" font-weight="bold">Sulfide</text><text x="96.0" y="235.5" text-anchor="start" font-size="17.3" fill="#1B1B1B" font-family="Inter" font-weight="400">12.5 mS/cm; moisture-sensitive handling adds 15% facility cost; 200-cycle data only</text></g><rect data-el="dr-compare:dr-compare-o:frame" data-semantic-ref="dr-compare-o" x="659.2" y="169.9" width="553.6" height="145.6" rx="10" fill="#FFFFFF"/><g data-el="dr-compare:dr-compare-o:content" data-semantic-ref="dr-compare-o"><text x="688.0" y="207.8" text-anchor="start" font-size="17.3" fill="#1B1B1B" font-family="Inter" font-weight="bold">Oxide</text><text x="688.0" y="235.5" text-anchor="start" font-size="17.3" fill="#1B1B1B" font-family="Inter" font-weight="400">1.2 mS/cm; air-stable handling; 2000-cycle data</text></g><g data-el="dr-compare:dr-compare-v:content" data-semantic-ref="dr-compare-v"><text x="67.2" y="372.6" text-anchor="start" font-size="17.3" fill="#1B1B1B" font-family="Inter" font-weight="400">Sulfide pilots; oxide stays the fallback</text></g><g data-el="dr-compare:takeaway:verdict"><text x="640.0" y="549.5" text-anchor="middle" font-size="17.3" fill="#B0322A" font-family="Inter" font-weight="bold">Sulfide pilots, oxide waits in reserve</text></g></svg>