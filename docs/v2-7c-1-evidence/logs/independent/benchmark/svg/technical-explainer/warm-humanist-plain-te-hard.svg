<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="100%" height="100%" fill="#EBEBE6"/><g data-el="te-hard:title:heading"><text x="67.2" y="107.0" text-anchor="start" font-size="53.3" fill="#2D2D2A" font-family="Merriweather" font-weight="bold" letter-spacing="-0.67">Manufacturing, not chemistry</text></g><g data-el="te-hard:takeaway:headline"><text x="67.2" y="190.7" text-anchor="start" font-size="20.0" fill="#2D2D2A" font-family="Inter" font-weight="bold">The factory is harder than the formula</text></g><rect data-el="te-hard:te-hard-b1:frame" data-semantic-ref="te-hard-b1" x="67.2" y="237.1" width="1145.6" height="351.4" rx="10" fill="#FFFFFF"/><g data-el="te-hard:te-hard-b1:content" data-semantic-ref="te-hard-b1"><text x="105.6" y="275.0" text-anchor="start" font-size="17.3" fill="#2D2D2A" font-family="Inter" font-weight="400">Cold-pressing stacks at scale is the open hard problem.</text></g><g data-el="te-hard:te-hard-b1:caveat" data-semantic-ref="te-hard-b1"><text x="105.6" y="551.1" text-anchor="start" font-size="13.3" fill="#5C5C59" font-family="Inter" font-weight="bold" letter-spacing="0.27">QUALIFIED</text></g></svg>